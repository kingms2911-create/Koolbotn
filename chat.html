<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot</title>
<style>
:root{--bg:#f2f4f7;--panel:#fff;--ink:#101828;--mute:#5b6678;--line:#d0d5dd;--acc:#0e7c66;--acc-ink:#fff;--me:#e3f1ee;--err:#b42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--panel:#18202a;--ink:#eef1f5;--mute:#9aa6b6;--line:#2b3644;--acc:#2fb99a;--acc-ink:#06241d;--me:#17332d;--err:#f97066}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:1.1rem}
header button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:720px;width:100%;margin:0 auto}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
summary{font-weight:600;cursor:pointer}
details label{display:block;font-weight:600;margin:12px 0 6px}
details small{display:block;color:var(--mute);font-weight:400}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--panel)}
.msg.me{align-self:flex-end;background:var(--me);border-color:transparent}
.msg a{color:var(--acc)}
.msg video,.live img{width:100%;border-radius:8px;margin-top:8px;background:#000}
.chip{align-self:flex-start;font-size:.85rem;color:var(--mute);border:1px dashed var(--line);border-radius:999px;padding:3px 10px;overflow-wrap:anywhere}
.err{color:var(--err);font-weight:600}
.ghost{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;font:inherit;padding:0 12px;cursor:pointer;white-space:nowrap}
.live{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.live .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem}
.live button{border:1px solid var(--err);color:var(--err);background:none;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
form{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel);max-width:none}
form textarea{min-height:44px;max-height:140px;resize:none}
#send{border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:600;padding:0 18px;cursor:pointer}
#send:disabled{opacity:.55}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><b>Bot</b><button id="new" type="button">Nayi chat</button></header>

<div id="log">
  <details id="set">
    <summary>Setup (sirf ek baar)</summary>
    <label for="url">Bot server URL<small>Jaise https://tumhara-bot.onrender.com</small></label>
    <input id="url" type="text" inputmode="url" autocomplete="off">
    <label for="key">BOT_SECRET<small>Sirf is browser mein save hota hai.</small></label>
    <input id="key" type="password" autocomplete="off">
  </details>
  <div class="msg">Namaste! Mujhse kuch bhi pucho, web search karwao, video banwao, ya app (PWA) banwake GitHub aur Vercel par deploy karwao.</div>
</div>

<form id="f">
  <button id="att" class="ghost" type="button" aria-label="Photos jodo">Photo</button>
  <input id="files" type="file" accept="image/*" multiple hidden>
  <textarea id="q" rows="1" placeholder="Kuch likho..." aria-label="Message"></textarea>
  <button id="send" type="submit">Bhejo</button>
</form>

<script>
const $ = id => document.getElementById(id);
const log = $("log");
const KEY = "bot_cfg", SID = "bot_sid";
const cfg = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
let sid = ""; try { sid = localStorage.getItem(SID) || ""; } catch (e) {}
if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); try { localStorage.setItem(SID, sid); } catch (e) {} }

function saveCfg() {
  const c = { url: $("url").value.trim().replace(/\/+$/, ""), key: $("key").value.trim() };
  try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
  return c;
}
(function () { const c = cfg(); $("url").value = c.url || ""; $("key").value = c.key || ""; $("set").open = !(c.url && c.key); })();

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fmt(text) {
  let h = esc(text).replace(/https?:\/\/[^\s<)\]]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
  const vid = (text.match(/https?:\/\/[^\s<)\]|]+\/video\/[a-f0-9]{32}\/file/) || [])[0];
  if (vid) h += `<video controls playsinline src="${esc(vid)}"></video>`;
  return h;
}
function add(cls, html) {
  const d = document.createElement("div");
  d.className = cls; d.innerHTML = html; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}

async function api(path, opts = {}) {
  const c = cfg();
  const r = await fetch(c.url + path, { ...opts, headers: { "x-api-key": c.key, ...(opts.body ? { "content-type": "application/json" } : {}) } });
  return r;
}

const pending = [];
const setAtt = () => { $("att").textContent = pending.length ? `Photo (${pending.length})` : "Photo"; };
function toJpeg(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let q = 0.82, d = cv.toDataURL("image/jpeg", q);
      while (d.length > 1.4e6 && q > 0.4) { q -= 0.12; d = cv.toDataURL("image/jpeg", q); }
      d.length > 1.9e6 ? rej(new Error("photo bahut badi hai")) : res(d);
    };
    img.onerror = () => rej(new Error("photo khul nahi payi"));
    img.src = url;
  });
}
$("att").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", async () => {
  for (const f of [...$("files").files]) {
    if (pending.length >= 6) { add("chip", "Ek baar mein 6 photo hi."); break; }
    try { pending.push(await toJpeg(f)); } catch (err) { add("chip", esc(err.message)); }
  }
  $("files").value = ""; setAtt();
});

const label = { web_search: "web search", make_video: "video job", check_video: "video status",
                build_pwa: "app build", check_pwa: "app status" };

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("q").value.trim();
  if (!text) return;
  const c = saveCfg();
  if (!c.url || !c.key) { $("set").open = true; return add("msg", '<span class="err">Pehle Setup mein URL aur secret daalo.</span>'); }
  const imgs = pending.splice(0); setAtt();
  add("msg me", esc(text) + (imgs.length ? `<br><small>(+${imgs.length} photo)</small>` : "")); $("q").value = ""; $("send").disabled = true;
  const wait = add("chip", '<span class="dot"></span> soch raha hoon...');
  try {
    const r = await api("/chat", { method: "POST", body: JSON.stringify({ session_id: sid, message: text, images: imgs }) });
    const d = await r.json();
    wait.remove();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Request fail ho gayi");
    for (const ev of d.events || []) {
      const q = ev.input && (ev.input.query || ev.input.topic || ev.input.description || ev.input.job_id) || "";
      add("chip", esc(`${label[ev.tool] || ev.tool}: ${q}`.slice(0, 140)));
      const m = ev.tool === "build_pwa" && /job_id=([a-f0-9]+)/.exec(ev.result || "");
      if (m) pwaCard(m[1]);
    }
    add("msg", fmt(d.reply));
  } catch (err) {
    wait.remove();
    add("msg", `<span class="err">${esc(err.message)}</span><br>URL/secret check karo. Server so raha ho to 1 min baad dobara try karo.`);
  }
  $("send").disabled = false; $("q").focus();
});

$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); $("f").requestSubmit(); }
});

function pwaCard(id) {
  add("live", `<div class="row"><span id="p-${id}">App build: shuru...</span></div><div id="l-${id}"></div>`);
  const names = { queued: "line mein", writing_code: "code likh raha hoon", github: "GitHub par daal raha hoon", vercel: "Vercel par deploy ho raha hai", done: "taiyaar", error: "fail" };
  const t = setInterval(async () => {
    try {
      const d = await (await api(`/pwa/${id}`)).json();
      $("p-" + id).textContent = "App build: " + (names[d.status] || d.status) + (d.detail ? " (" + d.detail + ")" : "");
      if (d.status === "done") {
        clearInterval(t);
        $("l-" + id).innerHTML = fmt(`Live: ${d.live_url}\nGitHub: ${d.repo_url}` + (d.note ? `\n${d.note}` : ""));
        log.scrollTop = log.scrollHeight;
      } else if (d.status === "error") {
        clearInterval(t);
        $("l-" + id).innerHTML = `<span class="err">${esc(d.error)}</span>`;
      }
    } catch (e) { clearInterval(t); }
  }, 4000);
}

$("new").addEventListener("click", async () => {
  try { await api("/reset", { method: "POST", body: JSON.stringify({ session_id: sid, message: "" }) }); } catch (e) {}
  sid = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()); try { localStorage.setItem(SID, sid); } catch (e) {}
  [...log.querySelectorAll(".msg,.chip,.live")].forEach(n => n.remove());
  add("msg", "Nayi chat shuru. Bolo!");
});
</script>
</body>
</html>
